<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Lindsey Sands · UpLevel</title>
  <link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<main>
<a class="back-link" href="../../lookbook/">← Back to lookbook</a>
<p class="eyebrow">UpLevel Attendee</p>
<h1>Lindsey Sands</h1>
<ul class="tag-list"><li class="tag tag--primary">Investor</li><li class="tag">Corporate Leader / Executive</li><li class="tag">Mentor / Advisor</li></ul>
<div class="page-layout">
<aside class="schedule-area">
<section class="section schedule-panel section--placeholder">
  <h2><button type="button" class="schedule-toggle" aria-expanded="false" aria-controls="schedule-content">
    Your schedule
    <span class="toggle-icon" aria-hidden="true">▸</span>
  </button></h2>
  <div class="schedule-content" id="schedule-content">
  <p>Coming closer to the event</p>
  </div>
</section>
</aside>
<div class="main-area">
<section class="section section--placeholder">
  <h2>Your matches</h2>
  <p>Coming after Part 2 data</p>
</section>
</div>
</div>
<script>
(function () {
  document.querySelectorAll(".schedule-toggle").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var expanded = btn.getAttribute("aria-expanded") === "true";
      btn.setAttribute("aria-expanded", String(!expanded));
      document.getElementById(btn.getAttribute("aria-controls")).classList.toggle("is-open", !expanded);
    });
  });
})();
</script>
</main>
</body>
</html>
